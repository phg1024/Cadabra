<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo</title>
<!--
  An example agent plugin for Cadabra (see docs/plugins.md). Cadabra only listens: it opens this page
  when the agent key goes down and tells it the words as they are recognized. Everything else happens
  here: the window's contents, Return to send, talking to the agent (agent.py next to this folder),
  showing the answer, reading it aloud, the look (an orb that breathes with the voice), and the token.
-->
<style>
  :root { --bg: #101418; --fg: #e8edf2; --dim: #8a96a3; --line: rgba(255, 255, 255, 0.1); }
  html, body { margin: 0; background: transparent; font: 14px -apple-system, "PingFang SC", sans-serif; color: var(--fg); }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 96px; }
  .body { padding: 10px 14px 12px; }
  .head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .head .status { margin-left: auto; font-weight: 400; color: var(--dim); font-size: 12px; }
  .asked { color: var(--dim); font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 8px; background: transparent; color: var(--fg); border: none;
             outline: none; resize: none; font: inherit; line-height: 1.45; }
  .reply { margin-top: 8px; line-height: 1.5; white-space: pre-wrap; max-height: 280px; overflow-y: auto; user-select: text; }
  .foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--dim); font-size: 11px; }
  .foot button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0; }
  .foot .spacer { flex: 1; }
  .foot input { flex: 1; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .error { color: #ffb36b; }
  [hidden] { display: none !important; }
</style>
<div class="card" id="card">
  <canvas id="orb"></canvas>
  <div class="body">
    <div class="head">Echo <span class="status" id="status"></span></div>
    <div class="asked" id="asked" hidden></div>
    <textarea id="words" rows="1" spellcheck="false"></textarea>
    <div class="reply" id="reply" hidden></div>
    <div class="foot">
      <span id="hint"></span><span class="spacer"></span>
      <button id="speak" title="Read aloud" hidden>🔊</button>
      <button id="copy" title="Copy" hidden>⧉</button>
      <button id="gear" title="Token">⚙︎</button>
    </div>
    <div class="foot" id="tokenRow" hidden>
      <input id="token" type="password" placeholder="Token, then Return (empty: none)">
    </div>
  </div>
</div>
<script>
const AGENT = "http://localhost:8787";   // also in plugin.json's "hosts"; nothing else is reachable
const $ = (id) => document.getElementById(id);
const zh = navigator.language.startsWith("zh");
const say = (cn, en) => (zh ? cn : en);

let phase = "idle";          // idle | listening | confirm | waiting | reply | failed
let activity = null, micLevel = 0, reply = "";
let conversation = null;     // {id, at}: a follow-up within five minutes continues it
let token = "";
cadabra.storage.get("token").then((value) => { token = value || ""; });

// --- what Cadabra tells us ---
cadabra.on("listen", () => { stopSpeaking(); $("words").value = ""; set("listening"); });
cadabra.on("partial", (e) => { $("words").value = e.text; fit(); });
cadabra.on("final", (e) => { $("words").value = e.text; set("confirm"); $("words").focus(); });
cadabra.on("level", (e) => { micLevel = e.value; });
cadabra.on("cancel", () => { set("idle"); });

// --- keys: Return sends, Shift-Return is a new line, esc closes ---
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); stopSpeaking(); set("idle"); cadabra.close(); return; }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && document.activeElement !== $("token")
      && (phase === "confirm" || phase === "failed")) {
    e.preventDefault(); send();
  }
});
$("gear").onclick = () => { $("tokenRow").hidden = !$("tokenRow").hidden; $("token").value = ""; if (!$("tokenRow").hidden) $("token").focus(); fit(); };
// Settings › Agent › Plugin settings… (plugin.json has "settings": true): the token field, ready to type in.
cadabra.on("settings", () => { $("tokenRow").hidden = false; $("token").value = ""; $("token").focus(); fit(); });
$("token").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  e.preventDefault();
  token = $("token").value.trim();
  $("token").value = "";
  cadabra.storage.set("token", token || null);
  $("tokenRow").hidden = true; fit();
});
$("copy").onclick = () => cadabra.copy(reply);
$("speak").onclick = () => (audio ? stopSpeaking() : speak(reply));

function set(next, message) {
  phase = next;
  const asking = next === "waiting" || next === "reply";
  $("words").readOnly = next !== "confirm" && next !== "failed";
  $("asked").textContent = $("words").value;
  $("words").hidden = asking;
  $("asked").hidden = !asking;
  $("reply").hidden = next !== "reply" && next !== "failed";
  $("reply").className = next === "failed" ? "reply error" : "reply";
  if (next === "failed") $("reply").textContent = message;
  $("speak").hidden = $("copy").hidden = next !== "reply";
  $("status").textContent = { listening: say("正在听…", "Listening…"), waiting: activity || say("正在想…", "Thinking…") }[next] || "";
  $("hint").textContent = {
    listening: say("松开结束 · esc 取消", "Release to finish · esc to cancel"),
    confirm: say("⏎ 发送 · esc 取消 · 可以先改字", "⏎ send · esc cancel · edit first if you like"),
    waiting: say("esc 关闭", "esc to close"),
    reply: say("esc 关闭", "esc to close"),
    failed: say("⏎ 重试 · esc 关闭", "⏎ retry · esc to close"),
  }[next] || "";
  fit();
}

// The window follows the content.
function fit() {
  $("words").style.height = "auto";
  $("words").style.height = $("words").scrollHeight + "px";
  requestAnimationFrame(() => cadabra.resize(440, Math.ceil($("card").getBoundingClientRect().height) + 2));
}

// --- talking to the agent ---
function headers(extra) {
  const h = { "Content-Type": "application/json", ...extra };
  if (token) h.Authorization = "Bearer " + token;
  return h;
}

async function send() {
  const words = $("words").value.trim();
  if (!words) return;
  activity = null;
  set("waiting");
  if (conversation && Date.now() - conversation.at > 5 * 60 * 1000) conversation = null;
  try {
    const response = await fetch(AGENT + "/text", {
      method: "POST", body: JSON.stringify({ text: words }),
      headers: headers({ Accept: "application/x-ndjson", ...(conversation ? { "X-Conversation-Id": conversation.id } : {}) }),
    });
    let answer = null;
    if ((response.headers.get("Content-Type") || "").includes("ndjson")) {
      // Streamed: one JSON object per line, what it is doing first, then the result.
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = buffer.split("\n");
        buffer = done ? "" : lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const event = JSON.parse(line);
          if (event.type === "activity") { activity = event.state; $("status").textContent = activity + "…"; }
          else answer = event;
        }
        if (done) break;
      }
    } else {
      answer = await response.json().catch(() => null);
    }
    if (!response.ok || !answer || answer.type === "error" || !answer.reply) {
      throw new Error((answer && answer.error) || say(`Agent 返回了 ${response.status}`, `The agent answered ${response.status}`));
    }
    if (answer.conversation_id) conversation = { id: answer.conversation_id, at: Date.now() };
    reply = answer.reply;
    $("reply").textContent = reply;
    activity = null;
    set("reply");
  } catch (error) {
    activity = null;
    set("failed", String(error.message || error));
  }
}

// --- reading aloud, with the voice's loudness for the orb ---
let audio = null, analyser = null, context = null;
async function speak(text) {
  try {
    const response = await fetch(AGENT + "/speech", { method: "POST", headers: headers(), body: JSON.stringify({ text, language: zh ? "zh" : "en" }) });
    if (!response.ok) return;
    context = context || new AudioContext();
    const buffer = await context.decodeAudioData(await response.arrayBuffer());
    stopSpeaking();
    audio = context.createBufferSource();
    audio.buffer = buffer;
    analyser = context.createAnalyser();
    analyser.fftSize = 512;
    audio.connect(analyser).connect(context.destination);
    audio.onended = () => { audio = null; analyser = null; };
    audio.start();
  } catch (error) { console.error(error); }
}
function stopSpeaking() { if (audio) { audio.onended = null; audio.stop(); } audio = null; analyser = null; }

// --- the orb: its colour says what is happening, its size follows the voice ---
const COLORS = { listening: [94, 229, 205], waiting: [182, 160, 255], speaking: [255, 182, 110], idle: [120, 150, 175] };
const canvas = $("orb"), ctx = canvas.getContext("2d");
let color = COLORS.idle.slice(), level = 0;
const samples = new Uint8Array(512);

function voice() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(samples);
  let sum = 0;
  for (const s of samples) sum += ((s - 128) / 128) ** 2;
  return Math.min(1, Math.sqrt(sum / samples.length) * 4);
}

function draw(now) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const key = audio ? "speaking" : phase === "listening" ? "listening" : phase === "waiting" ? "waiting" : "idle";
  const goal = key === "speaking" ? voice() : key === "listening" ? micLevel : 0;
  color = color.map((c, i) => c + (COLORS[key][i] - c) * 0.08);
  level += (goal - level) * (goal > level ? 0.5 : 0.12);
  const t = now / 1000, pulse = key === "waiting" ? 0.08 * Math.sin(t * 4) : 0;
  const r = h * (0.18 + 0.04 * Math.sin(t * 1.5) + level * 0.16 + pulse);
  const [cr, cg, cb] = color.map(Math.round);
  const glow = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, r * 2.6);
  glow.addColorStop(0, `rgba(${cr},${cg},${cb},0.35)`);
  glow.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
  ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
  const core = ctx.createRadialGradient(w / 2 - r * 0.3, h / 2 - r * 0.3, r * 0.1, w / 2, h / 2, r);
  core.addColorStop(0, "rgba(255,255,255,0.95)");
  core.addColorStop(1, `rgba(${cr},${cg},${cb},0.9)`);
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(w / 2, h / 2, r, 0, Math.PI * 2); ctx.fill();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
set("idle");
</script>
